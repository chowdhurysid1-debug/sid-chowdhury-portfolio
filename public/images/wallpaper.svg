<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1800" width="2400" height="1800">
  <defs>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="magenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#db2777" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070713" />
      <stop offset="55%" stop-color="#0c0a1c" />
      <stop offset="100%" stop-color="#05060f" />
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="130" />
    </filter>
    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65" />
    </radialGradient>
  </defs>

  <rect width="2400" height="1800" fill="url(#base)" />

  <g filter="url(#soft)">
    <ellipse cx="640" cy="470" rx="720" ry="560" fill="url(#violet)" />
    <ellipse cx="1780" cy="720" rx="760" ry="600" fill="url(#magenta)" />
    <ellipse cx="1080" cy="1320" rx="820" ry="540" fill="url(#blue)" />
    <ellipse cx="2080" cy="1520" rx="560" ry="440" fill="url(#cyan)" />
    <ellipse cx="330" cy="1560" rx="480" ry="380" fill="url(#amber)" />
    <ellipse cx="1420" cy="240" rx="520" ry="330" fill="url(#cyan)" />
  </g>

  <rect width="2400" height="1800" fill="url(#vignette)" />
</svg>
